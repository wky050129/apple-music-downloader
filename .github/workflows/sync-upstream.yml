name: Sync upstream

# Keeps this fork following zhaarey/apple-music-downloader: merges upstream main into
# main once a day, then runs the release workflow, which publishes a release (amdl
# binaries + MCP bundles) and the Docker image when upstream bumped VERSION.
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so the release is
# started explicitly. The sync fails, and GitHub reports the failed run, when the merge
# conflicts with this fork's changes or upstream changed files under .github/workflows
# (GITHUB_TOKEN may not push those). Then use "Sync fork" on GitHub or merge by hand.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/zhaarey/apple-music-downloader.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already contains upstream/main ($(git rev-parse --short upstream/main))."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit -m "Merge upstream zhaarey/apple-music-downloader $(git rev-parse --short upstream/main)" upstream/main
          git push origin HEAD:main
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Release
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
